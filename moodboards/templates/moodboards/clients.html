{% extends "base.html" %}
{% block title %}Заказчики — Moodboard{% endblock %}
{% block content %}
<h1>Заказчики</h1>
<div class="row g-3 mt-1">
{% for client in clients %}
  <div class="col-md-6"><div class="card"><div class="card-body">
    <h2 class="h5">{{ client.name }}</h2>
    <p class="mb-1">{{ client.email }}</p>
    <p class="text-muted mb-0">{{ client.company|default:"Компания не указана" }}</p>
  </div></div></div>
{% empty %}<p>Заказчиков пока нет.</p>{% endfor %}
</div>
{% endblock %}
