<div class="col-md-6 col-lg-4">
  <article class="card h-100 shadow-sm moodboard-card"
           style="border-top: .4rem solid {{ board.background_color }}">
    <div class="card-body">
      <h2 class="h5 card-title">
        <a href="{% url 'moodboards:detail' board.id %}">{{ board.title }}</a>
      </h2>
      <p class="card-text">
        {{ board.description|default:"Описание не указано."|truncatewords:25 }}
      </p>
      <p class="small text-muted mb-0">
        Дизайнер:
        {% if board.designer_name %}{{ board.designer_name }}{% else %}{{ board.designer.display_name }}{% endif %}
      </p>
    </div>
  </article>
</div>
