{% extends "base.html" %}
{% block title %}Новый мудборд — Moodboard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Создать мудборд</h1>
      <a href="{% url 'moodboards:list' %}">Отмена</a>
    </div>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      <label class="form-label" for="title">Название</label>
      <input class="form-control mb-3" id="title" name="title"
             value="{{ request.POST.title }}" required maxlength="160">

      <label class="form-label" for="description">Описание</label>
      <textarea class="form-control mb-3" id="description" name="description"
                rows="4">{{ request.POST.description }}</textarea>

      <div class="row">
        <div class="col-md-6">
          <label class="form-label" for="background_color">Цвет фона</label>
          <input class="form-control form-control-color mb-3" id="background_color"
                 name="background_color" type="color"
                 value="{{ request.POST.background_color|default:'#F4EFE6' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="palette">Палитра</label>
          <input class="form-control mb-3" id="palette" name="palette"
                 placeholder="#112233, #AABBCC"
                 value="{{ request.POST.palette }}">
          <div class="form-text mb-3">Укажите HEX-цвета через запятую.</div>
        </div>
      </div>

      <label class="form-label" for="catalog_id">Каталог</label>
      <select class="form-select mb-3" id="catalog_id" name="catalog_id">
        <option value="">Без каталога</option>
        {% for catalog in catalogs %}
        <option value="{{ catalog.pk }}"
          {% if request.POST.catalog_id == catalog.pk|stringformat:"s" %}selected{% endif %}>
          {{ catalog.name }}
        </option>
        {% endfor %}
      </select>

      <label class="form-label" for="client_id">Заказчик</label>
      <select class="form-select mb-4" id="client_id" name="client_id">
        <option value="">Без заказчика</option>
        {% for client in clients %}
        <option value="{{ client.pk }}"
          {% if request.POST.client_id == client.pk|stringformat:"s" %}selected{% endif %}>
          {{ client.name }} — {{ client.email }}
        </option>
        {% endfor %}
      </select>

      <button class="btn btn-primary" type="submit">Создать мудборд</button>
    </form>
  </div>
</div>
{% endblock %}
