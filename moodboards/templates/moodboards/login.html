{% extends "base.html" %}
{% block title %}Вход — Moodboard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1>Вход</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" class="card card-body mt-3">
      {% csrf_token %}
      <label class="form-label" for="username">Имя пользователя</label>
      <input class="form-control mb-3" id="username" name="username" required>
      <label class="form-label" for="password">Пароль</label>
      <input class="form-control mb-3" id="password" name="password" type="password" required>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
