{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <img src="{% static 'moodboards/logo.svg' %}" width="28" height="28" alt="">
      Moodboard
    </a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'moodboards:list' %}">Мудборды</a>
      <a class="nav-link" href="{% url 'moodboards:catalogs' %}">Каталоги</a>
      <a class="nav-link" href="{% url 'moodboards:clients' %}">Заказчики</a>
      <a class="nav-link" href="{% url 'moodboards:search' %}">Поиск</a>
      <a class="nav-link" href="{% url 'moodboards:statistics' %}">Статистика</a>
      {% if user.is_authenticated %}
      <span class="navbar-text ms-3">{{ user.username }}</span>
      <form class="d-inline" method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-link nav-link d-inline" type="submit">Выйти</button>
      </form>
      {% else %}
      <a class="nav-link" href="{% url 'moodboards:login' %}">Войти</a>
      <a class="nav-link" href="{% url 'moodboards:register' %}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
